[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datadiddler-lens-separator-reference"
version = "0.1.0"
description = "Reference separator lens for DataDiddler: minimal contract-aligned implementation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "MettleForgeLab" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]